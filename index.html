<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massachusetts Afterschool Programs Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div>
                <h1>Massachusetts Afterschool Programs</h1>
                <p class="subtitle">Find quality afterschool programs in your area</p>
            </div>
            <a href="admin-login.html" class="admin-login-btn" title="Admin Login">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                </svg>
                Admin
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h2>Search & Filter</h2>

                <!-- Search -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, city, or ZIP code...">
                    <button id="searchBtn" class="btn-primary">Search</button>
                </div>

                <!-- Filters -->
                <div class="filter-section">
                    <h3>Filters</h3>

                    <div class="filter-group">
                        <label for="countyFilter">County</label>
                        <select id="countyFilter">
                            <option value="">All Counties</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="regionFilter">Region</label>
                        <select id="regionFilter">
                            <option value="">All Regions</option>
                            <option value="Western">Western MA</option>
                            <option value="Central">Central MA</option>
                            <option value="Northeast">Northeast MA</option>
                            <option value="Southeast">Southeast MA</option>
                            <option value="Cape">Cape Cod & Islands</option>
                        </select>
                    </div>

                    <button id="clearFilters" class="btn-secondary">Clear Filters</button>
                </div>

                <!-- Data Layers -->
                <div class="layer-section">
                    <h3>Data Layers</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleLegislative">
                        <span>Legislative Districts</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleEEC">
                        <span>EEC Regional Offices</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleMunicipalities">
                        <span>Municipality Boundaries</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="togglePopDensity">
                        <span>Population Density</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleIncome">
                        <span>Median Household Income</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="togglePoverty">
                        <span>Child Poverty Rate</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleWorkingParents">
                        <span>Working Parent Households</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleSchoolDistricts">
                        <span>School Districts</span>
                    </label>
                </div>

            </div>

            <!-- Results -->
            <div class="results-section">
                <h3>Programs (<span id="resultsCount">0</span>)</h3>
                <div id="programsList" class="programs-list"></div>
            </div>
        </aside>

        <!-- Map -->
        <main class="map-container">
            <div id="map"></div>
            <div id="mapLoading" class="loading-overlay">
                <div class="spinner"></div>
                <p>Loading map data...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App JS -->
    <script src="app.js"></script>
</body>
</html>
